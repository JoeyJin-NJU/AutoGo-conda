[project]
name = "autogo-conda"
version = "0.1.0"
description = "A Conda-friendly Go AI self-play, training, and Arena framework"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Eric Jang" },
    { name = "JoeyJin-NJU" },
]
dependencies = [
    "fvcore>=0.1.5",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "mup>=1.0",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.0",
    "tyro>=0.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
